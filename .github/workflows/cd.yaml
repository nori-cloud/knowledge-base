name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitops-docs
  cancel-in-progress: false

jobs:
  sanity-check:
    name: Sanity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nori-cloud/actions/setup@a2e14326bca943a3b1cd129e3fa061d73616a806
      - run: pnpm sanity

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed_apps: ${{ steps.detect.outputs.changed_apps }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nori-cloud/actions/detect-changes@a2e14326bca943a3b1cd129e3fa061d73616a806
        id: detect
        with:
          app-list-file: .github/apps.json
          include-root-changes: "true"
          delivery-workflow: cd.yaml
          token: ${{ github.token }}

  build:
    name: Build (${{ matrix.app }})
    needs: [sanity-check, detect-changes]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.changed_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: nori-cloud/actions/build-image@a2e14326bca943a3b1cd129e3fa061d73616a806
        with:
          app: ${{ matrix.app }}
          dockerfile: ${{ matrix.dockerfile }}
          push: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy (${{ matrix.app }})
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.changed_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: nori-cloud/actions/gitops-update-overlay@a2e14326bca943a3b1cd129e3fa061d73616a806
        with:
          app: ${{ matrix.app }}
          tag: ${{ github.sha }}
          overlay: dev
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
      - uses: nori-cloud/actions/move-tag@a2e14326bca943a3b1cd129e3fa061d73616a806
        with:
          tag: ${{ matrix.app }}-dev
          sha: ${{ github.sha }}
          description: ${{ github.event.head_commit.message }}
